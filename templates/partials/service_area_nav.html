{# Service area dropdown, shared by base.html and index.html #}
{% from 'partials/service_areas.html' import service_areas %}
<div class="nav-dd" data-nav-dd>
  <button type="button" class="nav-dd-toggle cursor-target" aria-expanded="false" aria-controls="service-area-menu">
    Service area <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
  </button>
  <div class="nav-dd-menu" id="service-area-menu">
    <p class="nav-dd-label">Where we operate</p>
    <ul>
      {% for endpoint, city in service_areas %}
      <li><a href="{{ url_for(endpoint) }}"{% if request.endpoint == endpoint %} aria-current="page"{% endif %}><span class="nav-dd-city">{{ city }}</span></a></li>
      {% endfor %}
    </ul>
  </div>
</div>
